<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Our Stars</title>
<meta name="theme-color" content="#0d0716">
<link rel="icon" type="image/png" href="images/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3e8e4;--soft:#b9a8c4;--rose:#d98ba3;--gold:#e8cf9f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(70% 50% at 15% 8%,rgba(122,31,64,.55),transparent 70%),radial-gradient(60% 50% at 88% 75%,rgba(70,50,120,.45),transparent 70%),linear-gradient(#0d0716,#1a0b22 55%,#240d27) fixed;color:var(--ink);font:400 1rem/1.7 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:500;margin:0}
h1{font-size:clamp(2.4rem,9vw,3.8rem);color:var(--gold)}
h2{font-size:clamp(1.5rem,5vw,2rem);color:var(--gold);margin-bottom:6px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
section{max-width:620px;margin:0 auto;padding:36px 20px;text-align:center}
.lead{color:var(--soft);margin:0 0 20px}
.glass{background:rgba(255,245,240,.06);border:1px solid rgba(232,207,159,.22);border-radius:24px;padding:24px;backdrop-filter:blur(8px)}
.big{font:italic clamp(1.1rem,3.6vw,1.35rem)/1.7 "Playfair Display",Georgia,serif;margin:0}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:10px 22px;background:linear-gradient(135deg,#e6a3b6,#c9748f);color:#2a0c1c;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--soft)}
.top{position:fixed;top:12px;z-index:5;font-size:.9rem;padding:8px 16px;background:rgba(13,7,22,.75);color:var(--ink);border:1px solid rgba(232,207,159,.3)}
#snd{right:12px}.back{left:12px}
/* hero */
.pair{display:flex;align-items:center;justify-content:center;margin:34px auto 22px;max-width:260px}
.orb{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid #f3e3d0;box-shadow:0 0 30px rgba(217,139,163,.45);background:#3a1631;flex:none}
.thread{flex:1;height:2px;margin:0 -6px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px);position:relative;opacity:.8}
.thread::after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#e0607e;font-size:1.3rem;text-shadow:0 0 10px #e0607e;animation:hb 1.6s infinite}
@keyframes hb{0%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.35)}30%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.2)}}
#days{font:italic 1.15rem "Playfair Display",serif;color:var(--gold);margin:0}
/* polaroids */
.pol{width:min(320px,84vw);margin:34px auto;background:#f6ede4;padding:12px 12px 6px;border-radius:5px;box-shadow:0 14px 34px rgba(0,0,0,.55);transform:rotate(var(--r,0deg))}
.sc{position:relative;aspect-ratio:4/5;overflow:hidden;background:#2b1233}
.sc img{width:100%;height:100%;object-fit:cover;display:block}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .9s}
.sc.open canvas{opacity:0;pointer-events:none}
.cap{min-height:4.6em;padding:12px 6px 8px;color:#5a1a3a;font:italic 1.02rem/1.5 "Playfair Display",Georgia,serif;opacity:0;transition:opacity 1.2s .3s}
.cap.show{opacity:1}
.hint{display:block;margin:10px auto 0}
/* progress */
#starRow{font-size:1.6rem;color:var(--gold);letter-spacing:.2em}
#finale{margin-top:16px}
#finale[hidden]{display:none}
#dream small{display:block;font:600 .8rem Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:8px;font-style:normal}
.env{position:relative;width:min(300px,80vw);aspect-ratio:3/2;margin:0 auto;background:#ead7c8;border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,.55);transition:opacity .8s,transform .8s}
.env::before{content:"";position:absolute;inset:0;background:#dcc3b1;clip-path:polygon(0 0,100% 0,50% 62%);border-radius:8px 8px 0 0}
.env.fade{opacity:0;transform:scale(.9)}
.wax{position:absolute;left:50%;top:60%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#e0607e,#8f1d3a 70%);color:#ffd9e0;font-size:1.8rem;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 0 0 4px rgba(0,0,0,.12);animation:pulse 1.6s infinite}
.wax.locked{filter:grayscale(.75) brightness(.7);animation:none}
.wax.shake{animation:sh .4s}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.paper{position:relative;max-width:420px;margin:0 auto;background:linear-gradient(#f8efe6,#efe0d2);color:#4a1530;border-radius:6px;padding:30px 24px 22px;box-shadow:0 18px 40px rgba(0,0,0,.55);text-align:left;transform:rotate(-1deg)}
.paper::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(232,207,159,.7);transform:rotate(-3deg)}
#letter.in .paper{animation:slide 1.2s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(30px) rotate(-3deg)}}
.lpw{width:64%;margin:0 auto 18px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.lp{width:100%;overflow:hidden}
.lp img{width:100%;height:100%;object-fit:cover;display:block}
.lp.heart{clip-path:url(#heartClip)}
.lp:not(.heart){border:8px solid #fff;transform:rotate(2deg)}
.hand{font:italic 1.08rem/1.8 "Playfair Display",Georgia,serif;white-space:pre-line;margin:0}
.sig{text-align:right;font:italic 1.25rem "Playfair Display",Georgia,serif;margin:14px 0 0;opacity:0;transition:opacity 1.4s}
.sig.show{opacity:1}
footer{position:relative;z-index:1;text-align:center;color:var(--soft);padding:20px 20px 60px}
@media (prefers-reduced-motion:reduce){.thread::after{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<a class="btn top back" href="index.html">← Home</a>
<button class="top" id="snd" type="button">🌙 Dream sound: off</button>

<main>
<section>
  <h1>Under Our Stars</h1>
  <p class="lead">Scratch the sky to uncover our memories. ✨</p>
  <div class="pair"><span class="thread"></span></div>
  <p id="days"></p>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="heartClip" clipPathUnits="objectBoundingBox"><path d="M0.5,0.93 C0.08,0.62 0,0.42 0,0.27 C0,0.1 0.13,0 0.27,0 C0.38,0 0.46,0.06 0.5,0.14 C0.54,0.06 0.62,0 0.73,0 C0.87,0 1,0.1 1,0.27 C1,0.42 0.92,0.62 0.5,0.93 Z"/></clipPath></svg>
<div id="cards"></div>

<section>
  <div id="starRow"></div>
  <p class="lead" id="ptxt"></p>
</section>

<section id="letterSec">
  <div class="env" id="env"><button class="wax locked" id="wax" type="button" aria-label="Wax seal">♥</button></div>
  <p class="lead" id="sealTxt" style="margin-top:22px">Light every star to unlock my letter.</p>
  <div id="letter" hidden>
    <div class="paper">
      <div class="lpw" hidden><div class="lp"><img id="lph" alt=""></div></div>
      <p class="hand" id="ltxt"></p>
      <p class="sig" id="lsig"></p>
    </div>
  </div>
</section>

<section>
  <h2>Tonight's dream</h2>
  <p class="lead">The same one, on both our phones.</p>
  <div class="glass big" id="dream"></div>
</section>
</main>

<footer>Made with love, under every sky 💗<br><button class="ghost" id="reset" type="button" style="margin-top:14px;font-size:.85rem">Cover the memories again ↺</button></footer>

<script>
/* ============ EDIT THIS PART ============ */
const US={
  since:"2026-08-22",
  photos:[   // add a photo: put the file in the images folder, then add one line here
    // pos = which part of the photo to keep in view ("50% 10%" = near the top, where faces usually are)
    {src:"images/smile.jpeg",pos:"50% 8%",note:"There it is. That smile is my favourite thing on every screen."},
    {src:"images/lilbro-art.jpeg",note:"A little gift from your little brother: even Tom and Jerry know a heart is worth holding on to."},
    {src:"images/together.jpeg",pos:"50% 5%",note:"Side by side, finally in the same frame. My favourite view in the whole world."}
  ],
  letter:{
    photo:"images/my-smile.jpg",   // your smiling photo: save it in the images folder with this name
    pos:"50% 2%",                   // which part of the photo stays in view (faces are usually near the top)
    heart:true,                     // true = photo is cut in the shape of a heart, false = plain frame
    text:"My love,\n\nIf you are reading this, you have lit every star, and I hope you smiled the way you do when you think no one is watching.\n\nThat is my smile, up there. I wore it for you, and I keep it ready for the day I can finally give it to you in person.\n\nWherever you are tonight, someone is thinking of you, wishing on the same moon, and saving you the very best part of her heart.\n\nCome close, my love. I am right here.",
    sign:"Yours, always ♥"
  }
};
/* ============ END EDIT ============ */

const $=id=>document.getElementById(id);
const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* day counter */
const n=Math.max(1,Math.floor((Date.now()-new Date(US.since+"T00:00:00"))/864e5)+1);
$("days").textContent="Day "+n+" of us";

/* sky */
const cv=$("sky"),cx=cv.getContext("2d");let W,H,stars=[],shoots=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener("resize",rs);rs();
for(let i=0;i<120;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6.28});
function shoot(){shoots.push({x:Math.random()*W*.8,y:Math.random()*H*.4,vx:6+Math.random()*4,vy:3+Math.random()*2,l:60})}
addEventListener("pointerdown",e=>{if(!e.target.closest("button,a,canvas"))shoot()});
if(!RM)setInterval(shoot,7000);
(function loop(t){
  cx.clearRect(0,0,W,H);cx.fillStyle="#fff";
  stars.forEach(s=>{cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/1600+s.p));cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,6.28);cx.fill()});
  shoots=shoots.filter(o=>o.l>0);
  shoots.forEach(o=>{cx.globalAlpha=o.l/60;cx.strokeStyle="#e8cf9f";cx.lineWidth=2;cx.beginPath();cx.moveTo(o.x,o.y);cx.lineTo(o.x-o.vx*8,o.y-o.vy*8);cx.stroke();o.x+=o.vx;o.y+=o.vy;o.l--});
  cx.globalAlpha=1;requestAnimationFrame(loop);
})(0);

/* scratch polaroids */
let done=[],PH=[];try{done=JSON.parse(localStorage.getItem("paladin-scratch")||"[]").filter(x=>typeof x==="string")}catch(e){}
let finished=false;
function upd(celebrate){
  if(!PH.length){$("ptxt").textContent="Add photos to the images folder to begin.";return}
  const total=PH.length,d=PH.filter(p=>done.includes(p.src)).length;
  $("starRow").textContent="★".repeat(d)+"☆".repeat(total-d);
  $("ptxt").textContent=d===total?"Every star is lit.":d+" of "+total+" memories uncovered";
  if(d===total){
    $("wax").classList.remove("locked");$("sealTxt").textContent="Every star is lit. Tap the seal ♥";
    if(celebrate&&!finished){for(let i=0;i<8;i++)setTimeout(shoot,i*200);navigator.vibrate&&navigator.vibrate([60,60,60,60,200])}
    finished=true;
  }
}
function build(list){
PH=list;PH.forEach((p,i)=>{
  const pol=el("div",null,"pol");pol.style.setProperty("--r",["-2deg","1.6deg","-1.2deg","2deg"][i%4]);
  const box=el("div",null,"sc"),img=document.createElement("img");img.src=p.src;img.alt="";
  img.style.objectPosition=p.pos||"50% 15%";box.style.aspectRatio=Math.min(1.1,Math.max(.66,p.w/p.h));
  const c=document.createElement("canvas"),cap=el("div",p.note,"cap");
  box.append(img,c);pol.append(box,cap);
  const btn=el("button","or just reveal it","ghost hint");btn.type="button";btn.style.fontSize=".8rem";
  const wrap=el("section");wrap.style.padding="0 20px";wrap.append(pol,btn);$("cards").append(wrap);
  function open(){
    if(box.classList.contains("open"))return;
    box.classList.add("open");cap.classList.add("show");btn.hidden=true;
    if(!done.includes(p.src)){done.push(p.src);try{localStorage.setItem("paladin-scratch",JSON.stringify(done))}catch(e){}}
    shoot();navigator.vibrate&&navigator.vibrate(40);upd(true);
  }
  btn.onclick=open;
  if(done.includes(p.src)){box.classList.add("open");cap.classList.add("show");btn.hidden=true;return}
  const r=box.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,"#2b1233");g.addColorStop(1,"#5c2447");x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  for(let k=0;k<80;k++){x.fillStyle="rgba(232,207,159,"+(.2+Math.random()*.6)+")";x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,(.6+Math.random()*1.6)*d,0,6.3);x.fill()}
  x.fillStyle="#e8cf9f";x.textAlign="center";x.font="italic "+(19*d)+"px 'Playfair Display',Georgia,serif";x.fillText("scratch to reveal ✨",c.width/2,c.height/2);
  let down=false,last=null;
  function sc(e){
    const b=c.getBoundingClientRect(),k=c.width/b.width,px=(e.clientX-b.left)*k,py=(e.clientY-b.top)*k;
    x.globalCompositeOperation="destination-out";x.lineWidth=46*k;x.lineCap="round";x.lineJoin="round";
    x.beginPath();x.moveTo(last?last[0]:px,last?last[1]:py);x.lineTo(px+.01,py);x.stroke();last=[px,py];
  }
  c.addEventListener("pointerdown",e=>{down=true;last=null;c.setPointerCapture(e.pointerId);sc(e)});
  c.addEventListener("pointermove",e=>{if(down)sc(e)});
  ["pointerup","pointercancel"].forEach(ev=>c.addEventListener(ev,()=>{
    down=false;const px=x.getImageData(0,0,c.width,c.height).data;let t=0,m=0;
    for(let q=3;q<px.length;q+=64){m++;if(px[q]<100)t++}
    if(t/m>.5)open();
  }));
});upd(false);if(!$("wax").classList.contains("locked")&&had())openLetter(true)}
Promise.all(US.photos.map(p=>new Promise(r=>{const m=new Image();m.onload=()=>r({...p,w:m.naturalWidth,h:m.naturalHeight});m.onerror=()=>r(null);m.src=p.src}))).then(l=>build(l.filter(Boolean)));
$("reset").onclick=()=>{try{localStorage.removeItem("paladin-scratch");localStorage.removeItem("paladin-letter")}catch(e){}location.reload()};

/* the sealed love letter */
const L=US.letter;let opened=false;
const had=()=>{try{return localStorage.getItem("paladin-letter")}catch(e){return null}};
if(L.photo){
  const m=new Image(),lp=$("lph");
  m.onload=()=>{
    lp.src=L.photo;lp.style.objectPosition=L.pos||"50% 20%";
    const box=lp.parentNode;
    if(L.heart){box.classList.add("heart");box.style.aspectRatio="1.05"}else box.style.aspectRatio=Math.min(1.1,Math.max(.66,m.naturalWidth/m.naturalHeight));
    box.parentNode.hidden=false;
  };
  m.src=L.photo;
}
function openLetter(instant){
  if(opened)return;opened=true;
  const env=$("env"),out=$("ltxt"),sig=$("lsig");
  $("sealTxt").hidden=true;
  if(instant||RM)env.hidden=true;else{env.classList.add("fade");setTimeout(()=>env.hidden=true,800)}
  $("letter").hidden=false;$("letter").classList.add("in");
  sig.textContent=L.sign;
  try{localStorage.setItem("paladin-letter","1")}catch(e){}
  out.textContent=L.text;out.style.minHeight=out.offsetHeight+"px";out.textContent="";
  if(instant||RM){out.textContent=L.text;sig.classList.add("show");return}
  shoot();navigator.vibrate&&navigator.vibrate([50,40,50]);
  let i=0;const iv=setInterval(()=>{out.textContent=L.text.slice(0,++i);if(i>=L.text.length){clearInterval(iv);sig.classList.add("show")}},24);
}
$("wax").onclick=()=>{
  const w=$("wax");
  if(w.classList.contains("locked")){$("sealTxt").textContent="Light every star first ✨";w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");return}
  openLetter(false);
};

/* tonight's dream: same seed for both of us */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const day=new Date().toISOString().slice(0,10);let seed=0;for(const ch of day)seed=seed*31+ch.charCodeAt(0)|0;
const R=rng(seed),pick=a=>a[R()*a.length|0];
const place=pick(["a lantern-lit market floating above the clouds","a moonlit beach where the sea glows blue","an old castle library with a ceiling of stars","a field of fireflies at the edge of the world","a train that runs straight through the aurora","a rooftop in a city made of music","a secret garden where every flower hums","a candlelit ship drifting on a silver sea"]);
const doing=pick(["we dance without any music, because we are the music","we trade secrets only the stars may hear","we race the wind, and I let you win","we build a fort out of blankets and moonlight","we sit shoulder to shoulder and say nothing, perfectly","we follow a glowing path just to see where it leads"]);
const sign=pick(["a single white feather","the smell of rain","a door that wasn't there before","a song you almost know","a golden thread tied around your wrist"]);
const sm=el("small","Dream for "+day);$("dream").append(sm,`Tonight, we meet in ${place}. There, ${doing}. If you see ${sign}, that was me. Tell me everything in the morning.`);

/* dream sound (generated live, no files) */
let AC,master,on=false;
function audio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;master.connect(lp);lp.connect(AC.destination);
  [110,164.81,220,277.18,329.63].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
    o.frequency.value=f;o.detune.value=i*3;g.gain.value=.08;l.frequency.value=.05+i*.03;lg.gain.value=.04;
    l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();
  });
  setInterval(()=>{if(on)bell([659.25,739.99,880,987.77,1108.73][Math.random()*5|0])},3800);
}
function bell(f){
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(t+3.1);
}
$("snd").onclick=()=>{
  audio();AC.resume();on=!on;master.gain.linearRampToValueAtTime(on?.7:0,AC.currentTime+2);
  $("snd").textContent=on?"🌙 Dream sound: on":"🌙 Dream sound: off";
};
</script>
</body>
</html>
